const $=id=>document.getElementById(id);

const levels=[
 {at:100,name:'初闻梵音',note:'一声木鱼，一念初生'},

 {at:1000,name:'一念清净',note:'千声回响，杂念轻放'},

try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'){
 state.today=saved.date===state.date?Math.max(0,Math.trunc(Number(saved.today)||0)):0;
 state.total=Math.max(0,Math.trunc(Number(saved.total)||0));state.sound=saved.sound!==false;
}}catch(e){}
let dirty=false,saveTimer=0;
function save(){if(!dirty)return;dirty=false;clearTimeout(saveTimer);saveTimer=0;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function markDirty(){dirty=true;if(!saveTimer)saveTimer=setTimeout(save,700);}
function checkDay(){const now=dateKey();if(state.date!==now){state.date=now;state.today=0;markDirty();renderAll();}}
const fmt=n=>n.toLocaleString('zh-CN');
let lastLevel=-1;
function getLevel(){let i=0;while(i<levels.length&&state.today>=levels[i].at)i++;return i;}
function renderNums(){$('today').textContent=fmt(state.today);$('total').textContent=fmt(state.total);}
function renderLevel(){const i=getLevel(),prev=i?levels[i-1]:null,next=levels[i];
 $('levelName').textContent=prev?prev.name:'静待初鸣';$('awardSeal').textContent=i===10?'圆':'禅';$('levelCount').textContent=`${i} / 10 阶`;
 if(next){$('next').textContent=`距下阶 ${fmt(next.at-state.today)} 次`;$('progress').style.width=`${Math.min(100,(state.today-(prev?prev.at:0))/(next.at-(prev?prev.at:0))*100)}%`;}
 else{$('next').textContent='十阶圆满';$('progress').style.width='100%';}
 lastLevel=i;
}
function renderAll(){renderNums();renderLevel();$('sound').textContent=state.sound?'音效开启':'音效关闭';$('sound').classList.toggle('muted',!state.sound);$('sound').setAttribute('aria-pressed',String(state.sound));}
function toast(item){$('toastTitle').textContent=item.name;$('toastDesc').textContent=`今日敲击达到 ${fmt(item.at)} 次`;const el=$('toast');el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2300);}
function openModal(){checkDay();$('modalSummary').textContent=`今日已敲 ${fmt(state.today)} 次 · 解锁 ${getLevel()} / 10 阶`;
 $('levels').innerHTML=levels.map((x,i)=>`<div class="level ${state.today>=x.at?'earned':''} ${getLevel()===i+1?'active':''}"><div class="level-num">${String(i+1).padStart(2,'0')}</div><div class="level-body"><div class="level-name">${x.name}</div><div class="level-sub">${x.note}</div></div><div class="level-state">${state.today>=x.at?'✓ 已达成':fmt(x.at)+' 次'}</div></div>`).join('');
 $('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false');}
function closeModal(){$('modal').classList.remove('open');$('modal').setAttribute('aria-hidden','true');}
$('award').addEventListener('click',openModal);$('overlay').addEventListener('click',closeModal);$('closeModal').addEventListener('click',closeModal);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
// 6 个浮字节点、6 个动画对象只创建一次；高频点击不会持续增加 DOM。
const floatEls=Array.from($('floats').children);
const floatAnims=typeof Element.prototype.animate==='function'?floatEls.map(el=>{
 let a=el.animate([{opacity:0,transform:'translate3d(-50%,12px,0)'},{opacity:1,offset:.12,transform:'translate3d(-50%,-3px,0)'},{opacity:0,transform:'translate3d(-50%,-67px,0)'}],{duration:660,easing:'ease-out',fill:'both'});a.pause();a.currentTime=660;return a;
}):[];
let floatIndex=0;
function floatOne(){if(!floatAnims.length)return;const a=floatAnims[floatIndex++%floatAnims.length];a.currentTime=0;a.play();}
const ring=$('impact');let ringAnim=null;
if(ring.animate){ringAnim=ring.animate([{opacity:.52,transform:'translate3d(-50%,-50%,0) scale(.45)'},{opacity:0,transform:'translate3d(-50%,-50%,0) scale(1.7)'}],{duration:280,easing:'ease-out',fill:'both'});ringAnim.pause();ringAnim.currentTime=280;}
function pulse(){if(ringAnim){ringAnim.currentTime=0;ringAnim.play();}}

const voices=Array.from({length:6},()=>{const a=new Audio(WAV);a.preload='auto';return a;});let voiceIndex=0;
function playSound(){if(!state.sound)return;try{const a=voices[voiceIndex++%voices.length];a.pause();a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function recordHit(){checkDay();state.today++;state.total++;renderNums();const newLevel=getLevel();if(newLevel!==lastLevel){renderLevel();if(newLevel>0)toast(levels[newLevel-1]);}else{
 const next=levels[newLevel],previous=newLevel?levels[newLevel-1].at:0;if(next){$('progress').style.width=`${(state.today-previous)/(next.at-previous)*100}%`;$('next').textContent=`距下阶 ${fmt(next.at-state.today)} 次`;}}
 markDirty();floatOne();pulse();}
const stage=$('stage'),hit=$('hitbox');let touching=false,lastTouch=0,releaseTimer=0;
function press(){clearTimeout(releaseTimer);stage.classList.add('pressed');}
function release(){clearTimeout(releaseTimer);stage.classList.remove('pressed');}
// iPhone: touchstart 立即计数和显示动画；touchend 在 Safari 用户手势内播放音效。
hit.addEventListener('touchstart',e=>{if(e.touches.length!==1||touching)return;e.preventDefault();touching=true;lastTouch=Date.now();press();recordHit();},{passive:false});
hit.addEventListener('touchend',e=>{if(!touching)return;e.preventDefault();touching=false;lastTouch=Date.now();playSound();release();},{passive:false});
hit.addEventListener('touchcancel',()=>{touching=false;release();});
// 鼠标、键盘以及未产生 touch 事件的设备使用 click；过滤 iOS 合成 click，避免双计数。
hit.addEventListener('click',e=>{if(Date.now()-lastTouch<850){e.preventDefault();return;}press();recordHit();playSound();releaseTimer=setTimeout(release,80);});
// Windows 触控笔可以触发 pointerdown，而不影响触屏专用路径。
hit.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')press();});
hit.addEventListener('pointerleave',()=>{if(!touching)release();});
$('sound').addEventListener('click',()=>{state.sound=!state.sound;renderAll();markDirty();if(state.sound)playSound();});
let noticeTimer=0;
function notice(t){$('notice').textContent=t;$('notice').classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.remove('show'),1900);}
$('reset').addEventListener('click',()=>{if(!confirm('确定清空今日和累计的功德次数？此操作无法撤销。'))return;state.today=0;state.total=0;state.date=dateKey();renderAll();markDirty();save();notice('功德计数已重置');});
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else checkDay();});
setInterval(checkDay,60000);
renderAll();
})();
