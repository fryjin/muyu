<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="静心木鱼">
  <meta name="format-detection" content="telephone=no">
  <title>静心木鱼 · 一声一念</title>
  <style>
    :root { color-scheme: dark; --gold:#dcb66f; --softgold:#e9cf9a; --faint:#98918a; --ink:#090a0b; }
    *, *::before, *::after { box-sizing:border-box; }
    html { width:100%; height:100%; margin:0; overflow:hidden; -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; }
    body { width:100%; height:100%; height:100dvh; min-height:0; margin:0; overflow:hidden; position:relative;
      -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
      overscroll-behavior:none; touch-action:manipulation;
      color:#f6f0e9; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background:radial-gradient(ellipse 85% 46% at 52% 51%,rgba(76,55,29,.21),transparent 71%),
                 radial-gradient(ellipse 70% 36% at 50% 95%,rgba(51,43,32,.13),transparent 80%),
                 #090a0b;
    }
    body::after { content:""; position:fixed; pointer-events:none; inset:0;
      background:radial-gradient(ellipse 95% 85% at 50% 52%,transparent 40%,rgba(0,0,0,.38) 100%);
      z-index:0;
    }
    button { font:inherit; border:0; outline:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation; cursor:pointer; }
    button:focus-visible { outline:2px solid var(--gold); outline-offset:4px; }
    .app { position:relative; z-index:1; width:100%; height:100%; min-height:0;
      display:flex; flex-direction:column; align-items:center; padding:calc(env(safe-area-inset-top,0px) + 23px) 22px calc(env(safe-area-inset-bottom,0px) + 21px);
    }
    .header { width:100%; max-width:760px; display:flex; align-items:flex-start; justify-content:space-between; flex:none; min-height:66px; gap:18px; }
    .brand { display:flex; align-items:center; gap:11px; padding-top:4px; }
    .brand-mark { width:36px; height:36px; border-radius:50%; border:1px solid rgba(222,176,96,.51);
      display:grid; place-items:center; color:var(--gold); font-family:"STKaiti","KaiTi",serif; font-size:20px; line-height:1;
      box-shadow:inset 0 0 0 4px rgba(220,182,111,.045);
    }
    .brand-name { font-size:14px; font-weight:600; line-height:1.3; letter-spacing:2.5px; }
    .brand-sub { margin-top:4px; color:#6f6c68; font-size:9px; letter-spacing:2.35px; }
    .lifetime { display:flex; flex-direction:column; align-items:flex-end; margin-top:-3px; gap:2px; }
    .lifetime-label { color:#99918a; font-size:11px; letter-spacing:2px; }
    .lifetime-bottom { display:flex; align-items:baseline; gap:5px; }
    .lifetime-number { color:var(--softgold); font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:38px; letter-spacing:0; line-height:1.15; font-variant-numeric:tabular-nums; }
    .lifetime-unit { color:#a99b84; font-size:11px; }
    .main { width:100%; flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .intro { flex:none; text-align:center; margin-top:2px; margin-bottom:3px; }
    .intro-label { font-size:10px; letter-spacing:6px; padding-left:6px; color:#99836a; }
    .intro h1 { margin:12px 0 5px; font-size:clamp(21px,5vw,28px); line-height:1.32; font-weight:400; font-family:"STSong","Songti SC","Noto Serif CJK SC",serif; letter-spacing:5px; color:#e9d2a7; }
    .intro p { margin:7px 0 0; color:#817974; font-size:11px; letter-spacing:2px; }
    .stage { position:relative; flex:none; width:min(96vw,530px,54dvh); aspect-ratio:1 / 1.065; isolation:isolate; }
    .stage::before { content:""; position:absolute; z-index:0; pointer-events:none; left:10%; right:6%; top:50%; height:33%;
       background:radial-gradient(ellipse,rgba(192,126,48,.13),rgba(102,70,35,.07) 49%,transparent 73%); filter:blur(27px);
    }
    .floor-shadow { position:absolute; width:70%; height:9%; top:88%; left:16%; border-radius:50%;
      background:radial-gradient(ellipse,rgba(0,0,0,.8),rgba(0,0,0,.36) 49%,transparent 70%); filter:blur(9px); z-index:1; }
    .woodfish { position:absolute; z-index:2; pointer-events:none; width:82%; height:auto; left:6%; top:41%;
      transform:translate3d(0,0,0); transform-origin:48% 58%; will-change:transform;
      filter:drop-shadow(0 18px 18px rgba(0,0,0,.56));
    }
    .mallet { position:absolute; z-index:3; pointer-events:none; width:72%; height:auto; right:-13%; top:14%;
      transform:rotate(0deg); transform-origin:93% 49%; will-change:transform;
      filter:drop-shadow(0 12px 8px rgba(0,0,0,.35));
    }
    .tap-area { position:absolute; z-index:8; inset:4% -2% 0; width:104%; height:96%; background:transparent; border-radius:42%; cursor:pointer;
      -webkit-tap-highlight-color:transparent; touch-action:manipulation; -webkit-user-select:none; user-select:none;
    }
    .float-layer { position:absolute; z-index:7; inset:0; pointer-events:none; overflow:visible; }
    .float-one { position:absolute; white-space:nowrap; display:flex; align-items:baseline; gap:7px; color:#ffe3a0; pointer-events:none;
      font-size:13px; font-weight:500; text-shadow:0 1px 18px rgba(226,155,64,.43);
      animation:rise var(--duration,750ms) cubic-bezier(.13,.63,.12,1) forwards;
      will-change:transform,opacity;
    }
    .float-one strong { font-weight:500; font-family:Georgia,serif; color:#ffda82; font-size:27px; line-height:1; }
    @keyframes rise { 0% { transform:translate3d(0,12px,0) scale(.65); opacity:0; }
      17% {opacity:1;transform:translate3d(0,-5px,0) scale(1.05);} 75% {opacity:1;} 100% {opacity:0;transform:translate3d(var(--drift,0px),-96px,0) scale(.96);} }
    .combo { position:absolute; z-index:7; text-align:center; left:50%; top:24%; transform:translateX(-50%) translateY(5px); pointer-events:none;
      min-width:90px; display:flex; flex-direction:column; gap:4px; align-items:center; opacity:0; transition:opacity .15s ease,transform .15s ease;
    }
    .combo.visible { opacity:1; transform:translateX(-50%) translateY(0); }
    .combo-label { color:#aa8d62; letter-spacing:4px; font-size:10px; }
    .combo-number { color:#e9c585; font-size:23px; font-family:Georgia,serif; }
    .tap-tip { flex:none; display:flex; align-items:center; gap:10px; color:#9a8c77; font-size:12px; letter-spacing:3px; margin-top:0; }
    .tap-tip::before,.tap-tip::after { content:""; width:26px; height:1px; background:linear-gradient(to right,transparent,rgba(211,161,91,.34)); }
    .tap-tip::after { transform:rotate(180deg); }
    .footer { flex:none; width:100%; max-width:760px; padding-top:15px; border-top:1px solid rgba(234,200,149,.09);
      display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:57px;
    }
    .today { display:flex; flex-direction:column; gap:6px; }
    .today-title { font-size:10px; color:#827a71; letter-spacing:2px; }
    .today-value { font-family:Georgia,serif; font-size:25px; line-height:1; font-variant-numeric:tabular-nums; color:#b5a48b; }
    .today-unit {font:11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#716a60;margin-left:5px;}
    .footer-actions { display:flex; align-items:center; gap:9px; }
    .tool-button { height:39px; border:1px solid rgba(212,175,117,.18); background:rgba(211,180,127,.035); color:#a99c8a;
      display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:24px; padding:0 13px;
      transition:background .2s,border-color .2s; font-size:12px; }
    .tool-button:active { background:rgba(215,177,111,.13); border-color:rgba(212,175,117,.36); }
    .tool-button svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .tool-button.off { color:#686866; }
    .icon-only { padding:0; width:39px; }
    .tiny-notice { position:fixed; z-index:50; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 102px);
      transform:translateX(-50%) translateY(10px); padding:11px 16px; background:#29251f; border:1px solid #5a4731;
      border-radius:24px; color:#edcf94; font-size:12px; letter-spacing:1px; opacity:0; pointer-events:none;
      transition:opacity .2s,transform .2s; white-space:nowrap; }
    .tiny-notice.show {opacity:1;transform:translateX(-50%) translateY(0);}
    @media (max-height:700px) { .app { padding-top:calc(env(safe-area-inset-top,0px) + 13px); padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px); }
      .header { min-height:52px; }.intro h1 {margin-top:6px;margin-bottom:3px}.intro p {margin-top:4px}.intro-label {font-size:9px}
      .stage {width:min(93vw,530px,53dvh)} .footer {padding-top:10px; min-height:48px} .today-value {font-size:21px;} .tool-button {height:35px}.icon-only{width:35px}
    }
    @media (max-height:590px) { .intro p{display:none}.intro h1{font-size:21px}.intro-label{display:none}
      .stage{width:min(92vw,530px,52dvh)} .brand-sub{display:none} .tap-tip{font-size:11px}
    }
    @media (min-width:800px) { .app{padding-top:34px;padding-bottom:33px}.stage {width:min(510px,55dvh)} .intro{margin-bottom:5px}.tap-tip{margin-top:4px} }
    @media (prefers-reduced-motion:reduce) { .float-one{animation-duration:350ms!important} .combo{transition:none}.woodfish,.mallet{will-change:auto} }
  </style>

  <script>
    (() => {
      'use strict';
      // 全部在本地运行，不需要服务器、第三方脚本或网络。
      const STORE_KEY = 'zen-woodfish-v1';
      const $ = id => document.getElementById(id);
      const totalEl=$('total'),todayEl=$('today'),fishEl=$('woodfish'),malletEl=$('mallet');
      const tapArea=$('tapArea'),floats=$('floats'),comboEl=$('combo'),comboNum=$('comboNumber');
      const soundBtn=$('soundBtn'),soundText=$('soundText'),onIcon=$('soundOnIcon'),offIcon=$('soundOffIcon');
      const notice=$('notice');
      const todayKey=() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
      let record={total:0,today:0,date:todayKey(),sound:true};
      try {
        const prev=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
        if(prev && typeof prev==='object') {
          record.total=Math.max(0,Math.trunc(Number(prev.total)||0));
          record.today=prev.date===todayKey()?Math.max(0,Math.trunc(Number(prev.today)||0)):0;
          record.sound=prev.sound!==false;
        }
      } catch(e) { /* 禁用存储的私密浏览环境仍可正常敲击 */ }
      let saveTimer=0;
      function persist() {
        clearTimeout(saveTimer); saveTimer=0;
        try { localStorage.setItem(STORE_KEY,JSON.stringify(record)); } catch(e) { /* 不影响敲击 */ }
      }
      function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist,380); }
      function renderNumbers(){ totalEl.textContent=record.total.toLocaleString('zh-CN');todayEl.textContent=record.today.toLocaleString('zh-CN'); }
      function renderSound(){soundText.textContent=record.sound?'音效开启':'音效关闭';onIcon.style.display=record.sound?'':'none';offIcon.style.display=record.sound?'none':'';soundBtn.classList.toggle('off',!record.sound);soundBtn.setAttribute('aria-pressed',String(record.sound));soundBtn.setAttribute('aria-label',record.sound?'关闭敲击音效':'开启敲击音效');}
      renderNumbers();renderSound();

      let audioCtx=null,noiseBuffer=null,master=null;
      function setupAudio(){
        if(audioCtx)return audioCtx;
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC)return null;
        try {
          audioCtx=new AC();
          master=audioCtx.createDynamicsCompressor();
          master.threshold.value=-18; master.knee.value=14; master.ratio.value=4;
          master.attack.value=0.003;master.release.value=0.10;
          master.connect(audioCtx.destination);
          const len=Math.max(1,Math.floor(audioCtx.sampleRate*0.075));
          noiseBuffer=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
          const data=noiseBuffer.getChannelData(0);
          for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
        }catch(e){audioCtx=null;}
        return audioCtx;
      }
      function playKnock(){
        if(!record.sound)return;
        const ctx=setupAudio();if(!ctx)return;
        if(ctx.state==='suspended')ctx.resume().catch(()=>{});
        const t=ctx.currentTime+0.004;
        // 短促的木质击打声：基频、非谐波木腔泛音与敲击瞬态。
        [[460,.18,.15],[720,.093,.12],[1135,.048,.08]].forEach(([freq,vol,dur],i)=>{
          const o=ctx.createOscillator(),g=ctx.createGain();
          o.type=i===0?'triangle':'sine';
          o.frequency.setValueAtTime(freq*(.99+Math.random()*.02),t);
          o.frequency.exponentialRampToValueAtTime(freq*.9,t+dur);
          g.gain.setValueAtTime(.0001,t);
          g.gain.exponentialRampToValueAtTime(vol,t+.002);
          g.gain.exponentialRampToValueAtTime(.0001,t+dur);
          o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.014);
        });
        if(noiseBuffer){
          const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
          src.buffer=noiseBuffer;filter.type='bandpass';filter.frequency.value=1250;filter.Q.value=.62;
          gain.gain.setValueAtTime(.08,t);
          gain.gain.exponentialRampToValueAtTime(.0001,t+.047);
          src.connect(filter);filter.connect(gain);gain.connect(master);src.start(t);src.stop(t+.06);
        }
      }
      const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function animateStrike(){
        if(!malletEl.animate||!fishEl.animate)return;
        for(const el of [malletEl,fishEl]){
          try { el.getAnimations().forEach(a=>a.cancel()); }catch(e){}
        }
        malletEl.animate([
          {transform:'rotate(0deg)',offset:0},
          {transform:'rotate(-19deg) translateY(3px)',offset:.32},
          {transform:'rotate(-16deg) translateY(2px)',offset:.42},
          {transform:'rotate(3deg)',offset:.68},
          {transform:'rotate(0deg)',offset:1}
        ],{duration:reduced?110:260,easing:'cubic-bezier(.25,.65,.25,1)'});
        fishEl.animate([
          {transform:'translateY(0px) scale(1)',offset:0},
          {transform:'translateY(3px) scale(.985)',offset:.30},
          {transform:'translateY(-2px) scale(1.012)',offset:.62},
          {transform:'translateY(0px) scale(1)',offset:1}
        ],{duration:reduced?120:220,easing:'ease-out'});
      }
      function floatPlusOne(){
        if(floats.children.length>25)floats.firstElementChild.remove();
        const el=document.createElement('span');el.className='float-one';
        const x=42+Math.random()*27,y=51+Math.random()*14;
        el.style.left=x+'%';el.style.top=y+'%';
        el.style.setProperty('--drift',(Math.random()*68-34).toFixed(0)+'px');
        el.style.setProperty('--duration',reduced?'340ms':(690+Math.random()*230).toFixed(0)+'ms');
        el.innerHTML='<span>功德</span><strong>+1</strong>';
        floats.appendChild(el);
        el.addEventListener('animationend',()=>el.remove(),{once:true});
        // 兼容低动态模式及少数旧版浏览器
        setTimeout(()=>el.remove(),1150);
      }
      let lastTap=0,streak=0,comboTimer=0;
      function strike(){
        const date=todayKey();if(record.date!==date){record.date=date;record.today=0;}
        record.total++;record.today++;
        renderNumbers();queueSave();
        const now=performance.now();streak=now-lastTap<460?streak+1:1;lastTap=now;
        if(streak>=2){comboNum.textContent=streak;comboEl.classList.add('visible');}
        else comboEl.classList.remove('visible');
        clearTimeout(comboTimer);comboTimer=setTimeout(()=>{comboEl.classList.remove('visible');streak=0;},1150);
        animateStrike();floatPlusOne();playKnock();
      }
      // pointerdown 代替 click：手指接触即反馈，快速连点不漏计，也不会触发 iPhone 双击放大。
      let lastKeyboardHit=0;
      tapArea.addEventListener('keydown',e=>{
        if(e.key==='Enter' || e.key===' '){ e.preventDefault(); lastKeyboardHit=Date.now(); strike(); }
      });
      if(window.PointerEvent){
        tapArea.addEventListener('pointerdown',e=>{
          if(e.pointerType==='mouse'&&e.button!==0)return;
          e.preventDefault();strike();
        },{passive:false});
      }else{
        let lastTouch=0;
        tapArea.addEventListener('touchstart',e=>{e.preventDefault();lastTouch=Date.now();strike();},{passive:false});
        tapArea.addEventListener('click',()=>{if(Date.now()-lastTouch>500&&Date.now()-lastKeyboardHit>500)strike();});
      }
      tapArea.addEventListener('contextmenu',e=>e.preventDefault());
      soundBtn.addEventListener('click',()=>{record.sound=!record.sound;renderSound();persist();});
      let noticeTimer=0;
      function showNotice(text){ notice.textContent=text;notice.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),1700); }
      $('resetBtn').addEventListener('click',()=>{
        if(!window.confirm('确定清空今日及累计敲击记录吗？此操作不可撤销。'))return;
        record.total=0;record.today=0;record.date=todayKey();streak=0;
        comboEl.classList.remove('visible');floats.textContent='';renderNumbers();persist();showNotice('记录已清空');
      });
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist();});
      window.addEventListener('pagehide',persist);
    })();
  </script>
</body>
</html>
