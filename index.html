<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e7f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="静心木鱼">
  <meta name="format-detection" content="telephone=no">
  <title>静心木鱼 · 一声一念</title>
  <!-- v1.6: 重绘木槌 SVG 源图后预渲染成 WebP + CSS 合成层按压/回弹，不重置关键帧 -->
  <style>
    :root {
      color-scheme: light;
      --ink: #263d36;
      --moss: #285d50;
      --jade: #3f7968;
      --muted: #6f8981;
      --gold: #b58955;
      --softgold: #b58955;
      --border: rgba(70,113,100,.17);
      --paper: #eff4ec;
    }
    *,*::before,*::after { box-sizing:border-box; }
    html { width:100%; height:100%; margin:0; overflow:hidden; -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; }
    body { width:100%; height:100%; height:100dvh; min-height:0; margin:0; overflow:hidden; position:relative;
      -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
      overscroll-behavior:none;touch-action:manipulation;
      color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(ellipse 80% 43% at 89% 1%,rgba(176,210,186,.50),transparent 85%),
        radial-gradient(ellipse 100% 70% at 5% 75%,rgba(188,219,204,.47),transparent 85%),
        radial-gradient(ellipse 80% 45% at 55% 42%,rgba(255,255,249,.90),transparent 100%),
        linear-gradient(160deg,#edf3ea 0%,#f7f6ed 48%,#e1eee7 100%);
    }
    body::before { content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      opacity:.17;background-image:repeating-linear-gradient(0deg,rgba(45,87,70,.045) 0,rgba(45,87,70,.045) 1px,transparent 1px,transparent 4px); }
    button {font:inherit;border:0;outline:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;}
    button:focus-visible{outline:2px solid var(--jade);outline-offset:4px;}
    .scenery{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
    .zen-orb {position:absolute; width:min(88vw,520px); aspect-ratio:1; left:50%; top:42%; transform:translate(-50%,-50%);
      background:radial-gradient(circle,rgba(255,255,250,.83) 0%,rgba(242,245,230,.50) 55%,transparent 73%);border-radius:50%;}
    .bamboo{position:absolute;fill:none;stroke:#79a38a;stroke-linecap:round;stroke-linejoin:round;}
    .bamboo-right{height:min(58vh,550px);width:auto;right:-24px;top:20%;opacity:.18;}
    .bamboo-left{height:min(35vh,335px);width:auto;left:-50px;bottom:0;opacity:.16;transform:scaleX(-1);}
    .hills{position:absolute;bottom:-1%;left:0;width:100%;height:26%;min-height:110px;opacity:.47;}
    .cloud-mark{position:absolute; top:17%;left:6%;width:83px;opacity:.35;}
    .app{position:relative;z-index:1;width:100%;height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;
      padding:calc(env(safe-area-inset-top,0px) + 22px) 22px calc(env(safe-area-inset-bottom,0px) + 15px);}
    .header{width:100%;max-width:700px;display:flex;align-items:flex-start;justify-content:space-between;flex:none;min-height:65px;gap:12px;}
    .brand{display:flex;align-items:center;gap:10px;padding-top:4px;}
    .brand-mark{width:36px;height:36px;border-radius:50%;border:1px solid rgba(41,103,79,.47);display:grid;place-items:center;
      color:var(--moss);font-family:"STKaiti","KaiTi",serif;font-size:21px;line-height:1;background:rgba(255,255,252,.5);
      box-shadow:inset 0 0 0 3px rgba(58,109,91,.05);}
    .brand-name{font-size:14px;font-weight:650;line-height:1.3;letter-spacing:2px;color:var(--ink);}
    .brand-sub{margin-top:5px;color:#8d9f96;font-size:9px;letter-spacing:1.8px;white-space:nowrap;}
    .lifetime{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-top:-2px;}
    .lifetime-label{color:#658276;font-size:10px;letter-spacing:2px;}
    .lifetime-bottom{display:flex;align-items:baseline;gap:4px;}
    .lifetime-number{color:var(--moss);font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:35px;line-height:1.12;font-variant-numeric:tabular-nums;}
    .lifetime-unit{color:#738d7c;font-size:10px;}
    .main{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .intro{flex:none;text-align:center;margin:0 0 4px;}
    .intro-label{font-size:10px;letter-spacing:6px;padding-left:6px;color:#aa895e;}
    .intro h1{margin:10px 0 4px;font-size:clamp(21px,5vw,27px);line-height:1.3;font-weight:400;
      font-family:"STSong","Songti SC","Noto Serif CJK SC",serif;letter-spacing:4px;color:#285a4a;}
    .intro p{margin:4px 0 0;color:#81998d;font-size:10px;letter-spacing:2px;}
    .stage{position:relative;flex:none;width:min(90vw,455px,41dvh);aspect-ratio:1/1.065;isolation:isolate;touch-action:none;}
    .stage::before{content:"";position:absolute;z-index:0;pointer-events:none;width:92%;aspect-ratio:1;border-radius:50%;
      left:3%;top:17%;background:radial-gradient(circle,rgba(255,255,249,.62) 0%,rgba(206,224,203,.28) 55%,rgba(221,234,219,.02) 75%,transparent 78%);
      box-shadow:inset 0 0 0 1px rgba(103,144,116,.06);}
    .stage::after{content:"";position:absolute;pointer-events:none;z-index:0;inset:20% 7% 1% 7%;border:1px solid rgba(107,149,124,.10);
      border-radius:50%;transform:scaleY(.89);}
    .floor-shadow{position:absolute;width:67%;height:10%;top:85%;left:16%;border-radius:50%;
      background:radial-gradient(ellipse,rgba(81,102,83,.23) 0%,rgba(72,88,77,.10) 35%,rgba(72,88,77,.03) 59%,transparent 75%);z-index:1;}
    /* Fish stays a still image; only tiny compositor-only recoil on contact. */
    .woodfish{position:absolute;z-index:2;pointer-events:none;width:82%;height:auto;left:6%;top:41%;
      transform:translate3d(0,0,0);transform-origin:48% 58%;backface-visibility:hidden;
      transition:transform 140ms cubic-bezier(.16,1.32,.35,1);}
    /* New mallet is designed as SVG and pre-rasterized to 3x WebP for Safari compositor. */
    .mallet{position:absolute;z-index:3;pointer-events:none;width:72%;height:auto;right:-13%;top:14%;
      display:block;overflow:visible;transform:translate3d(0,0,0) rotate(0deg);transform-origin:93% 49%;
      will-change:transform;backface-visibility:hidden;
      transition:transform 155ms cubic-bezier(.2,1.25,.35,1);}
    .stage.is-hitting .mallet{transform:translate3d(0,0,0) rotate(-19deg);
      transition-duration:48ms;transition-timing-function:cubic-bezier(.15,.7,.24,1);}
    .stage.is-hitting .woodfish{transform:translate3d(0,2px,0) scale(.994);
      transition-duration:58ms;transition-timing-function:ease-out;}
    .tap-area{position:absolute;z-index:8;inset:4% -2% 0;width:104%;height:96%;background:transparent;border-radius:42%;
      -webkit-tap-highlight-color:transparent;touch-action:none;-webkit-user-select:none;user-select:none;}
    /* 只对 transform / opacity 做合成层动画，敲击环不会触发布局。 */
    .impact-wave{position:absolute;z-index:4;pointer-events:none;left:46%;top:52%;width:24%;aspect-ratio:1;
      border:1.5px solid rgba(192,147,86,.62);border-radius:50%;opacity:0;
      background:radial-gradient(circle,rgba(255,249,216,.34) 0%,rgba(246,232,185,.14) 43%,transparent 72%);
      transform:translate3d(-50%,-50%,0) scale(.72);
      transition:transform 135ms ease-out,opacity 110ms ease-out;}
    .stage.is-hitting .impact-wave{transform:translate3d(-50%,-50%,0) scale(1.08);opacity:.34;
      transition-duration:55ms;}
    .float-layer{position:absolute;z-index:7;inset:0;pointer-events:none;overflow:visible;}
    .float-one{position:absolute;white-space:nowrap;display:flex;align-items:baseline;gap:7px;color:#376d54;pointer-events:none;
      font-size:13px;font-weight:650;opacity:0;contain:layout style paint;}
    .float-one strong{font-weight:600;font-family:Georgia,serif;color:#ba8250;font-size:27px;line-height:1;}
    .combo{position:absolute;z-index:7;text-align:center;left:50%;top:22%;transform:translateX(-50%) translateY(5px);pointer-events:none;
      min-width:90px;display:flex;flex-direction:column;gap:4px;align-items:center;opacity:0;transition:opacity .15s,transform .15s;}
    .combo.visible{opacity:1;transform:translateX(-50%) translateY(0);}
    .combo-label{color:#798f78;letter-spacing:4px;font-size:10px;}
    .combo-number{color:#b47e4f;font-size:23px;font-family:Georgia,serif;}
    .tap-tip{flex:none;display:flex;align-items:center;gap:9px;color:#658679;font-size:11px;letter-spacing:2px;margin:0;}
    .tap-tip::before,.tap-tip::after{content:"";width:21px;height:1px;background:linear-gradient(to right,transparent,rgba(71,123,98,.35));}
    .tap-tip::after{transform:rotate(180deg);}
    .achievement-card{position:relative;flex:none;display:flex;align-items:center;width:min(100%,450px);min-height:87px;margin-top:17px;
      text-align:left;gap:11px;padding:13px 14px;border:1px solid rgba(74,125,102,.23);border-radius:15px;
      background:linear-gradient(130deg,rgba(255,255,249,.83),rgba(231,244,232,.74));
      box-shadow:0 6px 28px rgba(81,115,94,.08),inset 0 1px 0 rgba(255,255,255,.62);}
    .achievement-card:active{background:#e5f0e5;}
    .achievement-seal{flex:none;width:41px;height:41px;border-radius:50%;border:1px solid rgba(162,126,75,.48);
      display:grid;place-items:center;color:#a2804f;background:#faf7e9;font-family:"STKaiti","KaiTi",serif;font-size:22px;
      box-shadow:0 0 0 4px rgba(176,161,114,.09);}
    .achievement-body{flex:1;min-width:0;}
    .achievement-top{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:3px;}
    .achievement-overline{font-size:10px;letter-spacing:2px;color:#709084;}
    .achievement-count{font-size:10px;color:#7e9b8a;font-variant-numeric:tabular-nums;}
    .achievement-name{font-family:"STSong","Songti SC","Noto Serif CJK SC",serif;font-size:18px;letter-spacing:2px;line-height:1.4;color:#275745;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .achievement-bottom{display:flex;align-items:center;gap:8px;margin-top:4px;}
    .achievement-track{flex:1;min-width:12px;height:4px;background:#cbded0;border-radius:9px;overflow:hidden;}
    .achievement-fill{width:0%;height:100%;background:linear-gradient(90deg,#91baa2,#447d66);border-radius:9px;transition:width .2s;}
    .achievement-next{font-size:9px;color:#799388;white-space:nowrap;}
    .achievement-arrow{flex:none;width:15px;height:15px;color:#839d91;}
    .footer{flex:none;width:100%;max-width:700px;padding-top:11px;border-top:1px solid rgba(58,105,85,.18);
      display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:61px;}
    .today{display:flex;flex-direction:column;gap:5px;}.today-title{font-size:10px;color:#6a8a7c;letter-spacing:2px;}
    .today-value{font-family:Georgia,serif;font-size:25px;line-height:1;font-variant-numeric:tabular-nums;color:#2a5d4a;}
    .today-unit{font:11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#6e887a;margin-left:5px;}
    .footer-actions{display:flex;align-items:center;gap:8px;}
    .tool-button{height:38px;border:1px solid rgba(51,105,81,.2);background:rgba(255,255,252,.58);color:#517663;
      display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:24px;padding:0 12px;transition:background .2s,border-color .2s;font-size:12px;}
    .tool-button:active{background:rgba(169,205,181,.33);border-color:rgba(51,105,81,.42);}
    .tool-button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
    .tool-button.off{color:#89958f;}.icon-only{padding:0;width:38px;}
    .tiny-notice{position:fixed;z-index:50;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 102px);
      transform:translateX(-50%) translateY(10px);padding:11px 16px;background:#295445;border:1px solid rgba(255,255,255,.2);
      border-radius:24px;color:#fffaf0;font-size:12px;letter-spacing:1px;opacity:0;pointer-events:none;
      transition:opacity .2s,transform .2s;white-space:nowrap;box-shadow:0 7px 20px rgba(35,67,50,.2);}
    .tiny-notice.show{opacity:1;transform:translateX(-50%) translateY(0);}
    /* iPhone Safari 底部成就清单：遮罩不触发背景敲击，清单区域可纵向滚动 */
    .achieve-modal{position:fixed;z-index:100;inset:0;display:flex;align-items:flex-end;justify-content:center;
      visibility:hidden;opacity:0;pointer-events:none;transition:opacity .22s,visibility .22s;}
    .achieve-modal.open{visibility:visible;opacity:1;pointer-events:auto;}
    .achieve-backdrop{position:absolute;inset:0;background:rgba(31,60,49,.34);}
    .achieve-sheet{position:relative;width:min(100%,530px);height:auto;max-height:min(87dvh,780px);display:flex;flex-direction:column;
      border-radius:23px 23px 0 0;overflow:hidden;background:linear-gradient(180deg,#f9faf1,#edf4ea);
      box-shadow:0 -12px 50px rgba(22,65,49,.19);transform:translateY(15px);transition:transform .24s;
      padding:17px 19px calc(env(safe-area-inset-bottom,0px) + 16px);}
    .achieve-modal.open .achieve-sheet{transform:translateY(0);}
    .sheet-handle{width:38px;height:4px;border-radius:5px;background:#cadacd;align-self:center;margin-bottom:12px;}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;flex:none;gap:12px;}
    .sheet-kicker{font-size:10px;letter-spacing:4px;color:#a88a62;}
    .sheet-title{margin:4px 0 0;font-family:"STSong","Songti SC","Noto Serif CJK SC",serif;font-size:25px;letter-spacing:3px;color:#285949;font-weight:500;}
    .sheet-close{width:35px;height:35px;border-radius:50%;background:#e2eae0;color:#496b5b;font-size:24px;line-height:1;}
    .sheet-summary{font-size:12px;color:#668679;margin-top:7px;margin-bottom:14px;flex:none;}
    .levels-list{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;
      padding-bottom:4px;display:flex;flex-direction:column;gap:7px;scrollbar-width:thin;}
    .level-row{display:flex;align-items:center;gap:12px;min-height:53px;padding:9px 11px;border:1px solid rgba(78,114,92,.10);border-radius:11px;background:rgba(255,255,255,.42);}
    .level-row.earned{background:rgba(219,234,216,.72);border-color:rgba(52,121,85,.19);}
    .level-row.current{background:rgba(225,237,217,.95);border-color:rgba(52,121,85,.47);box-shadow:inset 3px 0 #5d9978;}
    .level-number{flex:none;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;border:1px solid #cad8c8;
      font:13px Georgia,serif;color:#9aaa9c;}
    .earned .level-number{background:#518269;color:#fffdf3;border-color:#518269;}
    .level-title-wrap{min-width:0;flex:1;}
    .level-name{font-family:"STSong","Songti SC","Noto Serif CJK SC",serif;color:#375d4c;font-size:15px;letter-spacing:1.5px;}
    .level-row:not(.earned) .level-name{color:#8fa599;}
    .level-subtitle{font-size:10px;color:#87998d;margin-top:3px;letter-spacing:.5px;}
    .level-status{flex:none;font-size:10px;color:#a1b0a4;}
    .earned .level-status{color:#467e60;}
    .sheet-foot{font-size:10px;text-align:center;color:#839c8b;margin-top:12px;flex:none;}
    .achievement-toast{position:fixed;z-index:95;top:24%;left:50%;width:min(310px,calc(100% - 48px));pointer-events:none;
      text-align:center;padding:21px 16px;border:1px solid rgba(151,126,80,.38);border-radius:18px;
      background:linear-gradient(145deg,rgba(255,253,241,.98),rgba(224,241,225,.98));
      box-shadow:0 14px 56px rgba(39,82,57,.22);opacity:0;transform:translate(-50%,-15px) scale(.95);transition:opacity .28s,transform .28s;}
    .achievement-toast.show{opacity:1;transform:translate(-50%,0) scale(1);}
    .toast-decoration{font-size:10px;letter-spacing:4px;color:#b58d54;}
    .toast-label{font-size:11px;color:#71927f;letter-spacing:3px;margin-top:9px;}
    .toast-title{font-family:"STSong","Songti SC","Noto Serif CJK SC",serif;font-size:26px;letter-spacing:3px;color:#2a614a;margin-top:7px;}
    .toast-desc{font-size:11px;color:#8c987e;margin-top:8px;}
    @media (max-height:740px){
      .app{padding-top:calc(env(safe-area-inset-top,0px) + 13px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);}
      .header{min-height:51px;}.intro h1{margin-top:5px;}.intro p{margin-top:3px;}.stage{width:min(90vw,455px,39dvh);}
      .achievement-card{min-height:74px;margin-top:10px;padding:9px 12px;}.achievement-seal{width:34px;height:34px;font-size:18px;}
      .achievement-name{font-size:16px;}.footer{padding-top:8px;min-height:52px;}.today-value{font-size:23px;}.tool-button{height:35px}.icon-only{width:35px;}
    }
    @media (max-height:610px){
      .intro p{display:none}.intro-label{display:none}.intro h1{font-size:19px;margin:3px 0}.stage{width:min(86vw,455px,35dvh);}
      .achievement-card{margin-top:7px;min-height:66px}.achievement-seal{width:30px;height:30px;font-size:17px}.achievement-top{margin:0}
      .achievement-bottom{margin-top:2px}.tap-tip{font-size:10px;}.brand-sub{display:none}
    }
    @media (min-width:800px){
      .app{padding-top:34px;padding-bottom:23px}.stage{width:min(450px,43dvh)}.achievement-card{margin-top:20px}
      .bamboo-right{right:5%;}.bamboo-left{left:4%;}
      .achieve-sheet{border-radius:23px 23px 0 0;}
    }
    @media (prefers-reduced-motion:reduce){.combo{transition:none}.impact-wave{display:none}.mallet,.woodfish{transition-duration:75ms!important}.achievement-toast{transition:none}.achieve-modal,.achieve-sheet{transition:none}}
  </style>
</head>

  <script>
    (() => {
      'use strict';
      // 全部在本地运行，不需要服务器、第三方脚本或网络。
      const STORE_KEY = 'zen-woodfish-v1';
      const $ = id => document.getElementById(id);
      const totalEl=$('total'),todayEl=$('today'),fishEl=$('woodfish'),malletEl=$('mallet');
      const tapArea=$('tapArea'),floats=$('floats'),impactWave=$('impactWave'),comboEl=$('combo'),comboNum=$('comboNumber');
      const soundBtn=$('soundBtn'),soundText=$('soundText'),onIcon=$('soundOnIcon'),offIcon=$('soundOffIcon');
      const notice=$('notice');
      const todayKey=() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
      let record={total:0,today:0,date:todayKey(),sound:true};
      try {
        const prev=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
        if(prev && typeof prev==='object') {
          record.total=Math.max(0,Math.trunc(Number(prev.total)||0));
          record.today=prev.date===todayKey()?Math.max(0,Math.trunc(Number(prev.today)||0)):0;
          record.sound=prev.sound!==false;
        }
      } catch(e) { /* 禁用存储的私密浏览环境仍可正常敲击 */ }
      let saveTimer=0;
      function persist() {
        clearTimeout(saveTimer); saveTimer=0;
        try { localStorage.setItem(STORE_KEY,JSON.stringify(record)); } catch(e) { /* 不影响敲击 */ }
      }
      // 连续敲击按固定间隔落盘，避免每一下都 clearTimeout/setTimeout。
      function queueSave(){ if(!saveTimer) saveTimer=setTimeout(persist,500); }

      let achievementToastTimer=0;
      const fmt=n=>n.toLocaleString('zh-CN');
      function getAchievementLevel(){
        let level=0;
        for(const item of ACHIEVEMENTS){if(record.today>=item.at)level++;else break;}
        return level;
      }
      function renderAchievement(){
        const level=getAchievementLevel();
        const current=level?ACHIEVEMENTS[level-1]:null;
        const next=ACHIEVEMENTS[level];
        achieveName.textContent=current?current.name:'静待初鸣';
        achieveSeal.textContent=level===10?'圆':level?'禅':'木';
        achieveCount.textContent=`${level} / 10 阶`;
        if(next){
          const base=current?current.at:0;
          const fraction=(record.today-base)/(next.at-base);
          achieveFill.style.width=Math.max(0,Math.min(100,fraction*100))+'%';
          achieveNext.textContent=`距下阶 ${fmt(next.at-record.today)} 次`;
        } else {
          achieveFill.style.width='100%';
          achieveNext.textContent='十阶圆满';
        }
        return level;
      }

        const level=getAchievementLevel();
        achieveSummary.textContent=`今日已敲 ${fmt(record.today)} 次 · 已解锁 ${level} / 10 阶`;
        achieveList.innerHTML=ACHIEVEMENTS.map((item,i)=>{
          const unlocked=record.today>=item.at;
          const current=unlocked&&(i===level-1);
          return `<div class="level-row ${unlocked?'earned':''} ${current?'current':''}">
             <span class="level-number">${String(i+1).padStart(2,'0')}</span>

      // 继续支持鼠标、键盘及辅助功能的 click；防止触摸后的合成 click 重复加一。
      tapArea.addEventListener('click',e=>{
        if(e.detail>0&&performance.now()<ignoreSyntheticClickUntil)return;
        if(e.detail===0&&e.isTrusted===false)return;
        pulseVisualStrike();strike();
      });
      // Safari 对双击缩放的补充拦截，适用于页面中非木鱼的点击区域。
      document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
      tapArea.addEventListener('contextmenu',e=>e.preventDefault());
      soundBtn.addEventListener('click',()=>{record.sound=!record.sound;renderSound();persist();if(record.sound)playKnock();});
      let noticeTimer=0;
      function showNotice(text){ notice.textContent=text;notice.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),1700); }
      $('resetBtn').addEventListener('click',()=>{
        if(!window.confirm('确定清空今日及累计敲击记录吗？此操作不可撤销。'))return;
        record.total=0;record.today=0;record.date=todayKey();streak=0;
        comboEl.classList.remove('visible');stageEl.classList.remove('is-hitting');resetFloats();renderNumbers();renderAchievement();persist();showNotice('记录已清空');
      });
      function refreshDailyDate(){
        const newDate=todayKey();
        if(record.date!==newDate){
          record.date=newDate;record.today=0;
          streak=0;comboEl.classList.remove('visible');
          renderNumbers();renderAchievement();
          if(achieveModal.classList.contains('open'))renderAchievementList();
          persist();
        }
      }
      setInterval(refreshDailyDate,30000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist();else refreshDailyDate();});
      window.addEventListener('pagehide',persist);
    })();
  </script>
</body>
</html>
